name: Release Obsidian plugin

on:
  push:
    tags: ["*"]

permissions:
  contents: write       # commit the version bump, create the release
  id-token: write       # let the job prove its identity for signing
  attestations: write   # save the attestations to the repo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a plain version (1.2.3, no "v")
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$VERSION' isn't a plain x.y.z version"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main            # the branch, so the version bump can be committed to it
          fetch-depth: 0

      - name: Set manifest.json version to the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          if git diff --quiet manifest.json; then
            echo "manifest.json already says $VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release $VERSION"
            git push origin main
          fi
          # Move the tag onto the commit that has the right version
          git tag -f "$VERSION"
          git push -f origin "$VERSION"

      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release with plugin files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            main.js manifest.json styles.css \
            --title "${{ github.ref_name }}" \
            --generate-notes